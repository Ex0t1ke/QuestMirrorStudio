name: Build and Release QuestMirrorStudio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and unpack scrcpy v5.0.1
        shell: pwsh
        run: |
          $targetDir = "bin"
          New-Item -ItemType Directory -Path $targetDir -Force
          $zipPath = "$targetDir/scrcpy.zip"
          $url = "https://github.com/Genymobile/scrcpy/releases/download/v5.0.1/scrcpy-win64-v5.0.1.zip"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $targetDir -Force
          Remove-Item $zipPath
          $nested = Get-ChildItem -Path $targetDir -Directory | Where-Object { $_.Name -like "scrcpy-win64*" }
          if ($nested) {
              Get-ChildItem -Path $nested.FullName | Move-Item -Destination $targetDir -Force
              Remove-Item $nested.FullName -Recurse -Force
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "QuestMirrorStudio" --icon "app.ico" --add-data "bin;bin" --collect-all customtkinter app.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuestMirrorStudio-exe
          path: dist/QuestMirrorStudio.exe

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QuestMirrorStudio.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
